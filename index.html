<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOLLY BINGO</title>
<script src="https://telegram.org"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;text-align:center;margin:0;padding:8px}
h1{color:#fbbf24;margin:4px 0;font-size:20px}
.top{display:flex;justify-content:space-around;background:#1e293b;padding:7px;border-radius:10px;margin-bottom:5px;font-weight:700;font-size:12px}
.pot{background:#064e3b;border:1px solid #34d399;color:#a7f3d0;padding:6px;border-radius:8px;margin-bottom:6px;font-size:12px;font-weight:700}
.tmr{background:#b91c1c;color:#fef08a;padding:7px;border-radius:8px;font-weight:700;margin-bottom:6px;border:1px solid #fbbf24;font-size:14px}
.bets button{background:#2563eb;color:#fff;border:none;padding:6px 11px;margin:2px;border-radius:6px;font-weight:700;font-size:12px}
.bets button.act{background:#16a34a;border:2px solid #fbbf24}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:310px;overflow-y:auto;background:#1e293b;padding:8px;border-radius:10px;margin-top:6px}
.cb{background:#334155;color:#fff;border:none;padding:8px 0;border-radius:5px;font-weight:700;font-size:12px}
.cb.sel{background:#22c55e;color:#0f172a}
#game{display:none}
.cbox{background:#1e293b;border:2px solid #fbbf24;border-radius:10px;padding:6px;margin:6px auto;max-width:310px}
.num{font-size:30px;font-weight:700;color:#4ade80}
.card-wrap{background:#1e293b;border:1px solid #475569;border-radius:10px;padding:6px;margin:8px auto;max-width:310px}
.card-wrap.banned{opacity:0.45;border:2px solid #ef4444}
table{margin:4px auto;border-collapse:collapse}
th{background:#fbbf24;color:#0f172a;width:44px;height:30px;font-size:16px}
td{width:44px;height:40px;border:1px solid #334155;font-size:15px;font-weight:700}
td.mk{background:#22c55e;color:#0f172a}
td.fr{background:#38bdf8;color:#0f172a;font-size:10px}
.wbtn{background:#ef4444;color:#fff;border:none;padding:9px 22px;font-size:15px;font-weight:700;border-radius:18px;margin-top:5px}
.wbtn:disabled{background:#475569;color:#94a3b8}
</style>
</head>
<body onclick="unlock()">
<h1>🎉 JOLLY BINGO 🎉</h1>
<div class="top">
<span>💳 ሂሳብ: <span id="bal">10.00</span> ብር</span>
<span>🎫 ካርቴላ: <span id="cid" style="color:#fbbf24">--</span></span>
<button id="snd" onclick="tSnd()" style="background:#334155;color:#fff;border:none;border-radius:5px;padding:3px 7px">🔊 ድምፅ</button>
</div>
<div class="pot">👥 ተጫዋቾች: <span id="pc">2</span> | 🏆 ደራሽ (80%): <span id="prz" style="color:#fbbf24">16.00</span> ብር</div>
<div id="lobby">
<div class="tmr">⏳ ጨዋታው ሊጀምር: <span id="sec">30</span> ሰከንድ (እስከ 2 ካርቴላ ይምረጡ)</div>
<div class="bets">
<button id="b10" class="act" onclick="sBet(10)">10 ብር</button>
<button id="b20" onclick="sBet(20)">20 ብር</button>
<button id="b50" onclick="sBet(50)">50 ብር (ሳምንታዊ)</button>
</div>
<div class="grid" id="grid"></div>
</div>
<div id="game">
<div class="cbox"><div>🎱 የሚጠራው ቁጥር</div><div class="num" id="cur">--</div><div style="font-size:11px;color:#94a3b8">የወጡ (<span id="cnt">0</span>/75): <span id="hist">--</span></div></div>
<div id="boards"></div>
<div id="wt" style="display:none;color:#fbbf24;margin-top:20px;font-weight:bold">👁 ጨዋታው ተጀምሯል! ቀጣዩ ዙር እስኪጀምር እየተመለከቱ ነው...</div>
</div>
<script>
let bal=10,bet=10,myCards=[],banned=[],pl=2,snd=1,unlk=0,lastRound=-1,lastIdx=-1,calledNums=[];
let aud=new Audio();
function unlock(){if(!unlk){aud.play().catch(function(){});unlk=1}}
function tSnd(){snd=!snd;document.getElementById("snd").innerText=snd?"🔊 ድምፅ":"🔇 ዝግ";unlock()}
function pAud(n){
if(!snd)return;
let pad=String(n).padStart(3,"0");
aud.src="sounds/Voice "+pad+".m4a";
aud.play().catch(function(){});
}
function uPot(){document.getElementById("pc").innerText=pl;document.getElementById("prz").innerText=(pl*bet*0.8).toFixed(2)}
function mCard(num){
let s=num*9301+49297,rnd=function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296},card=[];
for(let c=0;c<5;c++){let p=[],st=c*15+1;for(let n=st;n<st+15;n++)p.push(n);for(let i=p.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1)),x=p[i];p[i]=p[j];p[j]=x}card.push(p.slice(0,5))}
return card
}
function getRoundOrder(rId){
let s=rId*7919+104729,rnd=function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296},p=[];
for(let n=1;n<=75;n++)p.push(n);
for(let i=p.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1)),x=p[i];p[i]=p[j];p[j]=x}
return p
}
function dGrid(){
let g=document.getElementById("grid");g.innerHTML="";
for(let i=1;i<=400;i++){let b=document.createElement("button");b.innerText=i;b.id="c"+i;b.className="cb";if(myCards.indexOf(i)!==-1)b.classList.add("sel");b.onclick=function(){pick(i)};g.appendChild(b)}
}
function sBet(a){unlock();if(myCards.length>0)return;bet=a;document.querySelectorAll(".bets button").forEach(function(b){b.classList.remove("act")});document.getElementById("b"+a).classList.add("act");uPot()}
function pick(n){
unlock();
if(myCards.indexOf(n)!==-1){alert("✅ ካርቴላ #"+n+" ቀድሞ ተመርጧል!");return}
if(myCards.length>=2){alert("⚠️ አንድ ተጫዋች መያዝ የሚችለው እስከ 2 ካርቴላ ብቻ ነው!");return}
if(bal<bet){alert("❌ በቂ ሂሳብ የለዎትም!");return}
bal-=bet;myCards.push(n);pl++;
document.getElementById("bal").innerText=bal.toFixed(2);
document.getElementById("cid").innerText=myCards.map(x=>"#"+x).join(", ");
document.getElementById("c"+n).classList.add("sel");uPot()
}
function buildBoards(){
let box=document.getElementById("boards");box.innerHTML="";
myCards.forEach(function(cNum){
let card=mCard(cNum);
let wrap=document.createElement("div");wrap.className="card-wrap";wrap.id="wrap-"+cNum;
let title=document.createElement("div");title.style.fontWeight="bold";title.style.color="#fbbf24";title.innerText="🎫 ካርቴላ #"+cNum;
let tbl=document.createElement("table");
tbl.innerHTML="<thead><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr></thead>";
let tb=document.createElement("tbody");
for(let r=0;r<5;r++){let tr=document.createElement("tr");for(let c=0;c<5;c++){let td=document.createElement("td");if(r===2&&c===2){td.innerText="FREE";td.className="fr mk"}else{let val=card[c][r];td.innerText=val;td.id="x-"+cNum+"-"+c+"-"+r;td.dataset.val=val;td.onclick=function(){unlock();if(banned.indexOf(cNum)===-1)td.classList.toggle("mk")}}tr.appendChild(td)}tb.appendChild(tr)}
tbl.appendChild(tb);
let btn=document.createElement("button");btn.className="wbtn";btn.id="wbtn-"+cNum;btn.innerText="🎉 BINGO (#"+cNum+")";
btn.onclick=function(){cWin(cNum)};
wrap.appendChild(title);wrap.appendChild(tbl);wrap.appendChild(btn);box.appendChild(wrap);
});
}
function tick(){
let now=Math.floor(Date.now()/1000);
let cycle=300;
let rId=Math.floor(now/cycle);
let elapsed=now%cycle;
if(rId!==lastRound){
lastRound=rId;lastIdx=-1;myCards=[];banned=[];calledNums=[];pl=2;uPot();
document.getElementById("cid").innerText="--";document.getElementById("boards").innerHTML="";dGrid();
}
if(elapsed<30){
document.getElementById("lobby").style.display="block";document.getElementById("game").style.display="none";
document.getElementById("sec").innerText=(30-elapsed);
}else{
document.getElementById("lobby").style.display="none";document.getElementById("game").style.display="block";
if(myCards.length>0){
if(document.getElementById("boards").innerHTML==="")buildBoards();
document.getElementById("boards").style.display="block";document.getElementById("wt").style.display="none";
}else{
document.getElementById("boards").style.display="none";document.getElementById("wt").style.display="block";
}
let idx=Math.min(74,Math.floor((elapsed-30)/3.5));
if(idx!==lastIdx){
lastIdx=idx;let order=getRoundOrder(rId);calledNums=order.slice(0,idx+1);
let n=calledNums[calledNums.length-1];
document.getElementById("cur").innerText="BINGO"[Math.floor((n-1)/15)]+"-"+n;
document.getElementById("cnt").innerText=calledNums.length;
document.getElementById("hist").innerText=calledNums.slice(-5).join(", ");
pAud(n);
}
}
}
function cWin(cNum){
if(banned.indexOf(cNum)!==-1)return;
// ምልክት የተደረገባቸው ቁጥሮች በትክክል መጠራታቸውን እና መስመር መሙላቱን ማረጋገጥ
let ok=function(c,r){
if(c===2&&r===2)return true;
let e=document.getElementById("x-"+cNum+"-"+c+"-"+r);
if(!e||!e.classList.contains("mk"))return false;
let val=parseInt(e.dataset.val);
return calledNums.indexOf(val)!==-1;
};
let w=0;
for(let i=0;i<5;i++)if((ok(0,i)&&ok(1,i)&&ok(2,i)&&ok(3,i)&&ok(4,i))||(ok(i,0)&&ok(i,1)&&ok(i,2)&&ok(i,3)&&ok(i,4)))w=1;
if((ok(0,0)&&ok(1,1)&&ok(2,2)&&ok(3,3)&&ok(4,4))||(ok(0,4)&&ok(1,3)&&ok(2,2)&&ok(3,1)&&ok(4,0)))w=1;
if(ok(0,0)&&ok(4,0)&&ok(0,4)&&ok(4,4))w=1;
if(w){
let wa=pl*bet*0.8;bal+=wa;document.getElementById("bal").innerText=bal.toFixed(2);
alert("🎉🏆 እንኳን ደስ አለዎት! በካርቴላ #"+cNum+" BINGO አሸንፈዋል! +"+wa.toFixed(2)+" ብር");
myCards=[];document.getElementById("cid").innerText="--";document.getElementById("boards").innerHTML="";
}else{
banned.push(cNum);
document.getElementById("wrap-"+cNum).classList.add("banned");
let b=document.getElementById("wbtn-"+cNum);b.disabled=true;b.innerText="🚫 ታግዷል (ያለ ቢንጎ ተነክቷል)";
alert("🚫 ካርቴላ #"+cNum+" ገና ቢንጎ ሳይሞላ ስለተነካ ከዚህ ጨዋታ ታግዷል!");
}
}
setInterval(tick,500);tick();
</script>
</body>
</html>
